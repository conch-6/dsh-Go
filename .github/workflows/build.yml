name: Build APK (remote-only)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/dshgo-remote.jks"
          cat > app/android/key.properties <<EOF
          storeFile=$HOME/dshgo-remote.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Regenerate l10n from parts
        run: |
          cd app
          python3 tool/l10n_merge.py

      - name: Build APK (arm64, release)
        run: tooling/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-remote-arm64
          path: app/build/app/outputs/flutter-apk/*arm64*-release.apk
          if-no-files-found: error
